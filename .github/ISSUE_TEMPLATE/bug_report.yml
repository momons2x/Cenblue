name: Bug report
description: Report a reproducible Cenblue problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach cookies, profiles, databases, private logs, screenshots, or media. Sanitize all output.
  - type: input
    id: version
    attributes:
      label: Cenblue commit
      placeholder: Commit SHA or branch
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows, Node, pnpm, and browser versions
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized errors
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, sessions, private account data, local paths, and copyrighted media.
          required: true
